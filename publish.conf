# publish.conf - Settings for publish.sh (bash syntax: NAME=value, no spaces around "=").
#
# Set ENABLED=true once the site repository is cloned and `git push` works without
# prompts (SSH key without a passphrase, because cron has no terminal).
ENABLED=true

# Local clone of the GitHub Pages repository (zeuz.github.io). A relative path is
# relative to the project folder: output/ is the clone.
REPO_DIR=output

# Folder inside the site: the report is published as <REPO_DIR>/<SUBDIR>/index.html
# (output/traffic/index.html), i.e. https://zeuz.github.io/traffic/.
# Empty = site root (replaces the main index.html).
SUBDIR=traffic

BRANCH=main
REMOTE=origin
